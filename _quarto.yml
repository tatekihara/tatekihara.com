project:
  type: website
  output-dir: _site
  # WordPress 由来のファイルはビルドせずそのままコピーする（URL を維持するため）
  resources:
    - "wp-content/**"
    - "CNAME"
    - "robots.txt"
    - "files/**"
    - "lectures-and-seminars-講義・研究会/**"
    - "teaching/index.html"
    - "teaching/classes-担当授業/index.html"
    - "japanese/**"
    - "sfc/**"
    - "assets/og-card.jpg"

website:
  title: "Tate Kihara"
  site-url: "https://tatekihara.com"
  favicon: assets/favicon.png
  # SNS にリンクを貼ったときのカード表示（OpenGraph / Twitter Card）。
  # 画像と説明文は各ページの front matter で指定する。ここで image を指定しても、
  # Quarto は本文中の最初の画像（About なら顔写真）を優先してしまうため。
  image: assets/og-card.jpg
  open-graph:
    image-alt: "Keio University Shonan Fujisawa Campus"
  twitter-card:
    card-style: summary
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research/index.qmd
        text: Research
      - href: publications/index.qmd
        text: Publications
      - text: Teaching
        menu:
          - href: teaching/courses/index.qmd
            text: Courses
          - href: teaching/keio_students/index.qmd
            text: "For Students"
      - href: resources/index.qmd
        text: Resources
      - href: cv/index.qmd
        text: "CV & Contact"
  page-footer:
    center: "© Tate Kihara"

format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    css: assets/styles.css
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    include-in-header:
      # Google Search Console の所有権確認（URL プレフィックス プロパティ
      # https://tatekihara.com/ 用、2026-07-31 登録）。消すと確認が外れる。
      - text: |
          <meta name="google-site-verification" content="U9AvdBDqkcp5taY0bOzk6FZNUZwffZRuPdKgS1I-uy0" />
          <!-- OGP 画像の寸法。全ページ共通カード assets/og-card.jpg（1200x630）の実寸。
               Quarto 1.10.18 は open-graph の image-width/height キーを出力しないため直接注入 -->
          <meta property="og:image:width" content="1200" />
          <meta property="og:image:height" content="630" />
      # アクセス解析（GoatCounter、2026-08-14 設置）。Cookie を使わず、個人を特定できる
      # 情報も保存しない仕様のため同意バナーは置いていない。localhost からの表示は
      # GoatCounter 側で自動的に除外されるので、quarto preview はカウントされない。
      # ダッシュボード: https://tatekihara.goatcounter.com
      - text: |
          <script data-goatcounter="https://tatekihara.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
      # ナビの「Teaching」は 2 項目のメニュー（Classes / For Students、2026-10-04）。Quarto はメニューの中の
      # ページを開いているときに現在地の印を付けないので、ここで「Teaching」に付ける。
      - text: |
          <script>
          document.addEventListener('DOMContentLoaded', function () {
            var here = window.location.pathname.replace(/index\.html$/, '');
            document.querySelectorAll('.navbar .dropdown-menu .dropdown-item').forEach(function (a) {
              if (a.pathname.replace(/index\.html$/, '') !== here) return;
              a.setAttribute('aria-current', 'page');
              var menu = a.closest('.dropdown');
              var toggle = menu && menu.querySelector('.dropdown-toggle');
              if (toggle) toggle.classList.add('active');
            });
          });
          </script>
