project:
  type: website
  output-dir: _site
  # WordPress 由来のファイルはビルドせずそのままコピーする（URL を維持するため）
  resources:
    - "wp-content/**"
    - "CNAME"
    - "robots.txt"
    - "files/**"
    - "lectures-and-seminars-講義・研究会/**"
    - "teaching/index.html"
    - "japanese/**"
    - "sfc/**"
    - "assets/og-card.jpg"

website:
  title: "Tate Kihara"
  site-url: "https://tatekihara.com"
  favicon: assets/favicon.png
  # SNS にリンクを貼ったときのカード表示（OpenGraph / Twitter Card）。
  # 画像と説明文は各ページの front matter で指定する。ここで image を指定しても、
  # Quarto は本文中の最初の画像（About なら顔写真）を優先してしまうため。
  image: assets/og-card.jpg
  open-graph:
    image-alt: "Keio University Shonan Fujisawa Campus"
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: publications/index.qmd
        text: Publications
      - href: "teaching/classes-担当授業/index.qmd"
        text: Teaching
      - href: teaching/keio_students/index.qmd
        text: "SFC生向け / For SFC Students"
      - href: resources/index.qmd
        text: Resources
      - href: cv/index.qmd
        text: "CV & Contact"
  page-footer:
    center: "© Tate Kihara"

format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    css: assets/styles.css
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    # Google Search Console の所有権確認（URL プレフィックス プロパティ
    # https://tatekihara.com/ 用、2026-07-31 登録）。消すと確認が外れる。
    include-in-header:
      - text: |
          <meta name="google-site-verification" content="U9AvdBDqkcp5taY0bOzk6FZNUZwffZRuPdKgS1I-uy0" />
          <!-- OGP 画像の寸法。全ページ共通カード assets/og-card.jpg（1200x630）の実寸。
               Quarto 1.10.18 は open-graph の image-width/height キーを出力しないため直接注入 -->
          <meta property="og:image:width" content="1200" />
          <meta property="og:image:height" content="630" />
