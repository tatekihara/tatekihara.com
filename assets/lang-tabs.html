<script>
// 言語タブの共通スクリプト。
//   ページを開いたとき、最初に出すタブを次の順で決める（2026-10-04）:
//     1. URL の末尾が #japanese / #english なら、それに従う
//     2. 読む人が前に自分でタブを選んでいれば、それに従う（ブラウザに覚えさせてある）
//     3. ブラウザの言語設定で、日本語と英語のうち優先順位が上のほう（どちらもなければ英語）
//     4. 言語設定が読めなければ、ページの既定のタブのまま
//   読む人がタブを切り替える → その選択を覚え、URL の末尾を書き換えて、その状態のまま共有・ブックマークできるようにする。
//   自動で選んだだけのときは URL を書き換えない（共有された相手には、その人の言語で出るように）。
// 旧 /japanese/ の転送先もこの仕組みに乗せている。
// タブの並び順はページごとに異なる（About は英語先、SFC生向けは日本語先）ため、
// 固定インデックスではなくリンクの表示文字列で日本語タブを見つける。
(function () {
  var KEY = 'lang-tab';

  function stored() {
    try { return window.localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function remember(lang) {
    try { window.localStorage.setItem(KEY, lang); } catch (e) { /* 覚えられなくても表示には影響しない */ }
  }

  // ブラウザの言語設定を優先順に見て、最初に出てくる日本語か英語を返す
  function browserLang() {
    var list = navigator.languages && navigator.languages.length ? navigator.languages : (navigator.language ? [navigator.language] : []);
    if (!list.length) return null;
    for (var i = 0; i < list.length; i++) {
      var code = String(list[i]).toLowerCase();
      if (code.indexOf('ja') === 0) return 'ja';
      if (code.indexOf('en') === 0) return 'en';
    }
    return 'en';
  }

  function init() {
    var tabset = document.querySelector('.panel-tabset.lang-tabset');
    if (!tabset) return;

    var links = tabset.querySelectorAll('.nav-tabs .nav-link');
    if (links.length < 2) return;

    var jaLink = null, enLink = null;
    Array.prototype.forEach.call(links, function (link) {
      if (link.textContent.trim() === '日本語') {
        jaLink = link;
      } else if (!enLink) {
        enLink = link;
      }
    });
    if (!jaLink || !enLink) return;

    var byHash = { '#japanese': jaLink, '#english': enLink };
    var byLang = { ja: jaLink, en: enLink };
    var pendingAuto = 0;   // スクリプトが起こした切り替えの数（読む人の操作と区別するため、下で 1 つずつ消す）

    function show(link) {
      if (!link || link.classList.contains('active')) return;
      pendingAuto += 1;
      if (window.bootstrap && window.bootstrap.Tab) {
        window.bootstrap.Tab.getOrCreateInstance(link).show();
      } else {
        link.click();
      }
    }

    // 読む人が切り替えたとき（クリックでもキーボードでも）: 選択を覚え、URL を更新する（画面はスクロールさせない）
    Array.prototype.forEach.call(links, function (link) {
      link.addEventListener('shown.bs.tab', function () {
        if (pendingAuto > 0) { pendingAuto -= 1; return; }
        var lang = link === jaLink ? 'ja' : 'en';
        var hash = lang === 'ja' ? '#japanese' : '#english';
        remember(lang);
        if (window.location.hash !== hash) {
          history.replaceState(null, '', window.location.pathname + hash);
        }
      });
    });

    // 読み込み時: URL の指定、前の選択、ブラウザの言語設定の順で決める
    show(byHash[window.location.hash] || byLang[stored()] || byLang[browserLang()]);

    // 別ページから /#japanese で戻ってきた場合にも追随する
    window.addEventListener('hashchange', function () {
      show(byHash[window.location.hash]);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
